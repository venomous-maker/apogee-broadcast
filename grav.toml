name = "apogee-broadcast"
lib = "src/all.grav"
grav = ">=1.12.0"
paths = ["src"]

[dependencies]
apogee-package = "github.com/venomous-maker/apogee-package@v0.1.1"
apogee-config = "github.com/venomous-maker/apogee-config@v0.2.0"
apogee-routing = "github.com/venomous-maker/apogee-routing@v0.3.0"
grav-logger = "github.com/venomous-maker/grav-logger@v0.2.1"
apogee-container = "github.com/venomous-maker/apogee-container@v0.2.0"
apogee-events = "github.com/venomous-maker/apogee-events@v0.2.0"
apogee-http = "github.com/venomous-maker/apogee-http@v0.3.0"
# (the tests send events through a real server)
apogee-sockets = "github.com/venomous-maker/apogee-sockets@v0.2.1"
